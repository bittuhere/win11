    function initCalculator(winId) {
        const wid = winId;
        let expression = '';
        let currentNum = '0';
        let lastOperator = '';
        let shouldReset = false;

        const el = document.getElementById(`window-${winId}`);
        if (!el) return;

        el.querySelectorAll('.calc-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.calc;
                const exprEl = el.querySelector('.calc-expression');
                const resultEl = el.querySelector('.calc-result');

                if ('0123456789'.includes(val)) {
                    if (shouldReset || currentNum === '0') { currentNum = val; shouldReset = false; }
                    else currentNum += val;
                    resultEl.textContent = currentNum;
                } else if (val === '.') {
                    if (!currentNum.includes('.')) currentNum += '.';
                    resultEl.textContent = currentNum;
                } else if (val === 'C') {
                    expression = ''; currentNum = '0'; lastOperator = ''; shouldReset = false;
                    exprEl.textContent = '';
                    resultEl.textContent = '0';
                } else if (val === 'CE') {
                    currentNum = '0';
                    resultEl.textContent = '0';
                } else if (val === 'DEL') {
                    currentNum = currentNum.slice(0, -1) || '0';
                    resultEl.textContent = currentNum;
                } else if (val === '±') {
                    currentNum = String(-parseFloat(currentNum));
                    resultEl.textContent = currentNum;
                } else if (val === '%') {
                    currentNum = String(parseFloat(currentNum) / 100);
                    resultEl.textContent = currentNum;
                } else if ('+-*/'.includes(val)) {
                    expression += currentNum + ' ' + val + ' ';
                    exprEl.textContent = expression;
                    shouldReset = true;
                } else if (val === '=') {
                    expression += currentNum;
                    try {
                        const result = Function('"use strict";return (' + expression + ')')();
                        resultEl.textContent = parseFloat(result.toFixed(10));
                        currentNum = String(parseFloat(result.toFixed(10)));
                    } catch { resultEl.textContent = 'Error'; currentNum = '0'; }
                    expression = '';
                    exprEl.textContent = '';
                    shouldReset = true;
                }
            });
        });
    }

    function initTerminal(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const termBody = el.querySelector('.terminal-body');
        const termOutput = el.querySelector('.terminal-output');
        const input = el.querySelector('.terminal-input');
        if (!input) return;

        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();

                // Add command entry to terminal history output
                const cmdLine = document.createElement('div');
                cmdLine.style.display = 'flex';
                cmdLine.style.gap = '8px';
                cmdLine.innerHTML = `
                    <span style="color: #569cd6; font-weight:bold;">PS</span>
                    <span style="color: #dcdcaa; font-weight:bold;">C:\\Users\\User&gt;</span>
                    <span style="color: white;">${cmd}</span>
                `;
                termOutput.appendChild(cmdLine);

                if (cmd) {
                    const response = document.createElement('pre');
                    response.style.margin = '4px 0 12px 0';
                    response.style.fontFamily = 'inherit';
                    response.style.fontSize = 'inherit';
                    response.style.color = '#cccccc';
                    response.style.whiteSpace = 'pre-wrap';
                    response.style.wordBreak = 'break-all';

                    const lower = cmd.toLowerCase();

                    if (lower === 'help') {
                        response.innerHTML = `Local PowerShell commands:
  help           Display this local workspace help
  clear / cls    Clear screen
  date           Get today's local system date
  time           Get local system time
  whoami         Retrieve current logged user details
  ver            Retrieve Windows Mock Build specifications

Real-System Commands (Delegated to python backend server.py!):
  All others (e.g. ls, pwd, cat, uname -a, python3 --version, df -h, etc.)`;
                    } else if (lower === 'clear' || lower === 'cls') {
                        termOutput.innerHTML = '';
                        input.value = '';
                        return;
                    } else if (lower === 'date') {
                        response.textContent = new Date().toLocaleDateString();
                    } else if (lower === 'time') {
                        response.textContent = new Date().toLocaleTimeString();
                    } else if (lower === 'whoami') {
                        response.textContent = 'DESKTOP-WIN11\\User';
                    } else if (lower === 'ver') {
                        response.textContent = 'Microsoft Windows [Version 11.0.22631.3000 Web-Engine]';
                    } else {
                        // Forward command to our genuine python api cmd runner
                        try {
                            const res = await fetch('/api/cmd', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ command: cmd })
                            });
                            const data = await res.json();
                            if (data.success) {
                                response.textContent = data.output || '(No output returned)';
                            } else {
                                response.innerHTML = `<span style="color:#f44">Error executing command on backend: ${data.error}</span>`;
                            }
                        } catch (err) {
                            response.innerHTML = `<span style="color:#f44">Local Python backend server offline or CORS restricted. Executing locally: '${cmd}' not found.</span>`;
                        }
                    }
                    termOutput.appendChild(response);
                }

                input.value = '';
                termBody.scrollTop = termBody.scrollHeight;
            }
        });

        termBody.addEventListener('click', () => input.focus());
    }

    function initNotepad(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const textarea = el.querySelector('.notepad-textarea');
        const charCountEl = el.querySelector('.np-char-count');
        const btnSave = el.querySelector('.np-save');
        const btnDownload = el.querySelector('.np-download');
        const filenameInput = el.querySelector('.np-filename');

        if (!textarea || !charCountEl) return;

        const updateStatus = () => {
            const chars = textarea.value.length;
            const lines = textarea.value.split('\n').length;
            charCountEl.textContent = `Lines: ${lines} | Chars: ${chars}`;
        };

        textarea.addEventListener('input', updateStatus);

        btnSave.addEventListener('click', async () => {
            const filename = filenameInput.value.trim() || 'note.txt';
            const content = textarea.value;

            try {
                const res = await fetch('/api/files?action=write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: filename, content })
                });
                const data = await res.json();
                if (data.success) {
                    showSystemNotification("Notepad", `Successfully saved ${filename} to workspace root!`);
                } else {
                    showSystemNotification("Notepad", `Failed to save: ${data.error}`);
                }
            } catch (err) {
                showSystemNotification("Notepad", "Error: Local backend not responding.");
            }
        });

        btnDownload.addEventListener('click', () => {
            const filename = filenameInput.value.trim() || 'note.txt';
            const blob = new Blob([textarea.value], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        });

        updateStatus();
    }

    function initBrowser(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const iframe = el.querySelector('.browser-iframe');
        const urlInput = el.querySelector('.browser-url');
        const btnBack = el.querySelector('.browser-nav-btn.back');
        const btnForward = el.querySelector('.browser-nav-btn.forward');
        const btnRefresh = el.querySelector('.browser-nav-btn.refresh');
        const tabsContainer = el.querySelector('.browser-tabs');
        const btnAddTab = el.querySelector('.add-tab-btn');

        let tabHistory = { '1': [] };
        let currentTabId = '1';

        const loadUrl = (url) => {
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            urlInput.value = url;
            iframe.src = `/api/proxy?url=${encodeURIComponent(url)}`;
            tabHistory[currentTabId].push(url);
        };

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loadUrl(urlInput.value.trim());
            }
        });

        btnBack.addEventListener('click', () => {
            const history = tabHistory[currentTabId];
            if (history && history.length > 1) {
                history.pop();
                const prev = history[history.length - 1];
                urlInput.value = prev;
                iframe.src = `/api/proxy?url=${encodeURIComponent(prev)}`;
            }
        });

        btnRefresh.addEventListener('click', () => {
            iframe.src = iframe.src;
        });

        tabsContainer.addEventListener('click', (e) => {
            const tab = e.target.closest('.browser-tab');
            if (tab && !e.target.classList.contains('close-tab-btn')) {
                tabsContainer.querySelectorAll('.browser-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTabId = tab.dataset.tabId;
                const history = tabHistory[currentTabId];
                if (history && history.length > 0) {
                    urlInput.value = history[history.length - 1];
                    iframe.src = `/api/proxy?url=${encodeURIComponent(history[history.length - 1])}`;
                }
            } else if (e.target.classList.contains('close-tab-btn')) {
                const tab = e.target.closest('.browser-tab');
                const id = tab.dataset.tabId;
                tab.remove();
                delete tabHistory[id];
                const remaining = tabsContainer.querySelector('.browser-tab');
                if (remaining) {
                    remaining.classList.add('active');
                    currentTabId = remaining.dataset.tabId;
                    const history = tabHistory[currentTabId];
                    if (history && history.length > 0) {
                        urlInput.value = history[history.length - 1];
                        iframe.src = `/api/proxy?url=${encodeURIComponent(history[history.length - 1])}`;
                    }
                }
            }
        });

        btnAddTab.addEventListener('click', () => {
            const newId = String(Date.now());
            tabHistory[newId] = [];
            const tabEl = document.createElement('div');
            tabEl.className = 'browser-tab';
            tabEl.dataset.tabId = newId;
            tabEl.style.cssText = 'background:#1f1f1f; padding:6px 16px; border-radius:6px 6px 0 0; font-size:12px; display:flex; align-items:center; gap:8px; cursor:pointer; color:white;';
            tabEl.innerHTML = `
                <svg viewBox="0 0 16 16" style="width:12px;height:12px;fill:#0078d4;"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 1c3.86 0 7 3.14 7 7s-3.14 7-7 7-7-3.14-7-7 3.14-7 7-7z"/></svg>
                <span>New Tab</span>
                <span class="close-tab-btn" style="opacity:0.6; margin-left:8px; cursor:pointer;">×</span>
            `;
            tabsContainer.insertBefore(tabEl, btnAddTab);
            tabsContainer.querySelectorAll('.browser-tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');
            currentTabId = newId;
            loadUrl('https://www.bing.com');
        });

        // Click handlers for home page shortcut tiles
        el.querySelectorAll('.browser-shortcut').forEach(shortcut => {
            shortcut.addEventListener('click', () => {
                const name = shortcut.querySelector('.bs-name').textContent.toLowerCase();
                const url = `https://www.${name}.com`;
                loadUrl(url);
            });
        });
    }

    function initExplorer(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const grid = el.querySelector('.file-grid');
        const sidebar = el.querySelector('.file-sidebar');
        const addressText = el.querySelector('.address-text');
        const searchInput = el.querySelector('.file-search-input');
        const btnBack = el.querySelector('.btn-back');
        const btnNewFolder = el.querySelector('.btn-new-folder');
        const btnNewFile = el.querySelector('.btn-new-file');

        let currentPath = '';

        const loadFiles = async () => {
            try {
                const res = await fetch(`/api/files?action=list&path=${encodeURIComponent(currentPath)}`);
                const data = await res.json();

                grid.innerHTML = '';
                addressText.textContent = `This PC > ${currentPath || 'Desktop'}`;

                if (data.files) {
                    data.files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 8px; border-radius:4px; cursor:pointer; transition:background 0.1s; position:relative;';

                        let icon = file.is_dir ? '📁' : '📄';
                        const ext = file.name.split('.').pop().toLowerCase();
                        if (['jpg', 'jpeg', 'png', 'gif', 'ico'].includes(ext)) {
                            icon = '🖼️';
                        } else if (file.name.includes('xlsx')) {
                            icon = '📊';
                        } else if (file.name.includes('docx')) {
                            icon = '📄';
                        }

                        item.innerHTML = `
                            <div style="font-size:32px;">${icon}</div>
                            <div class="fi-name" style="font-size:11px; text-align:center; color:#ccc; word-break:break-all; max-width:80px;">${file.name}</div>
                            <div class="file-actions-overlay" style="display:none; position:absolute; bottom:2px; right:2px; background:rgba(0,0,0,0.8); border:1px solid #444; border-radius:4px; gap:4px; padding:2px;">
                                <button class="btn-rename-sub" style="background:#0078d4; border:none; color:white; font-size:9px; padding:1px 4px; border-radius:2px; cursor:pointer;">Rename</button>
                                <button class="btn-delete-sub" style="background:#c42b1c; border:none; color:white; font-size:9px; padding:1px 4px; border-radius:2px; cursor:pointer;">Del</button>
                            </div>
                        `;

                        item.addEventListener('mouseenter', () => {
                            item.querySelector('.file-actions-overlay').style.display = 'flex';
                        });
                        item.addEventListener('mouseleave', () => {
                            item.querySelector('.file-actions-overlay').style.display = 'none';
                        });

                        item.querySelector('.btn-rename-sub').addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const newName = prompt("Enter new name:", file.name);
                            if (newName && newName.trim()) {
                                const source = currentPath ? `${currentPath}/${file.name}` : file.name;
                                const target = currentPath ? `${currentPath}/${newName.trim()}` : newName.trim();
                                try {
                                    const r = await fetch('/api/files?action=rename', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ path: source, new_path: target })
                                    });
                                    const d = await r.json();
                                    if (d.success) loadFiles();
                                } catch (err) { console.log(err); }
                            }
                        });

                        item.querySelector('.btn-delete-sub').addEventListener('click', async (e) => {
                            e.stopPropagation();
                            if (confirm(`Are you sure you want to delete ${file.name}?`)) {
                                const source = currentPath ? `${currentPath}/${file.name}` : file.name;
                                try {
                                    const r = await fetch('/api/files?action=delete', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ path: source })
                                    });
                                    const d = await r.json();
                                    if (d.success) loadFiles();
                                } catch (err) { console.log(err); }
                            }
                        });

                        item.addEventListener('dblclick', async () => {
                            if (file.is_dir) {
                                currentPath = currentPath ? `${currentPath}/${file.name}` : file.name;
                                loadFiles();
                            } else {
                                const ext = file.name.split('.').pop().toLowerCase();
                                if (['txt', 'html', 'json', 'js', 'py', 'sh', 'md', 'xml'].includes(ext)) {
                                    try {
                                        const fileRel = currentPath ? `${currentPath}/${file.name}` : file.name;
                                        const fileRes = await fetch(`/api/files?action=read&path=${encodeURIComponent(fileRel)}`);
                                        const fileData = await fileRes.json();

                                        const app = APPS.find(a => a.id === 'notepad');
                                        if (app) {
                                            openApp(app);
                                            setTimeout(() => {
                                                const notepadWin = document.querySelector('.notepad-body');
                                                if (notepadWin) {
                                                    notepadWin.querySelector('.notepad-textarea').value = fileData.content;
                                                    notepadWin.querySelector('.np-filename').value = fileRel;
                                                    notepadWin.querySelector('.notepad-textarea').dispatchEvent(new Event('input'));
                                                }
                                            }, 350);
                                        }
                                    } catch (err) { console.log(err); }
                                } else if (['jpg', 'jpeg', 'png', 'gif', 'ico'].includes(ext)) {
                                    try {
                                        const fileRel = currentPath ? `${currentPath}/${file.name}` : file.name;
                                        const fileRes = await fetch(`/api/files?action=read&path=${encodeURIComponent(fileRel)}`);
                                        const fileData = await fileRes.json();

                                        const app = APPS.find(a => a.id === 'photos');
                                        if (app) {
                                            openApp(app);
                                            setTimeout(() => {
                                                const photosWin = document.querySelector('.photos-body');
                                                if (photosWin) {
                                                    photosWin.querySelector('.photos-main-image').src = fileData.content;
                                                }
                                            }, 350);
                                        }
                                    } catch (err) { console.log(err); }
                                }
                            }
                        });

                        grid.appendChild(item);
                    });
                }
            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:24px; color:#f44;">Failed to connect to local workspace API.</div>`;
            }
        };

        sidebar.addEventListener('click', (e) => {
            const item = e.target.closest('.file-sidebar-item');
            if (item) {
                sidebar.querySelectorAll('.file-sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentPath = item.dataset.path || '';
                loadFiles();
            }
        });

        btnBack.addEventListener('click', () => {
            if (currentPath) {
                const parts = currentPath.split('/');
                parts.pop();
                currentPath = parts.join('/');
                loadFiles();
            }
        });

        btnNewFolder.addEventListener('click', async () => {
            const name = prompt("Enter new folder name:");
            if (name && name.trim()) {
                const full = currentPath ? `${currentPath}/${name.trim()}` : name.trim();
                try {
                    const res = await fetch('/api/files?action=mkdir', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: full })
                    });
                    const d = await res.json();
                    if (d.success) loadFiles();
                } catch (err) { console.log(err); }
            }
        });

        btnNewFile.addEventListener('click', async () => {
            const name = prompt("Enter new file name:");
            if (name && name.trim()) {
                const full = currentPath ? `${currentPath}/${name.trim()}` : name.trim();
                try {
                    const res = await fetch('/api/files?action=write', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: full, content: '' })
                    });
                    const d = await res.json();
                    if (d.success) loadFiles();
                } catch (err) { console.log(err); }
            }
        });

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            grid.querySelectorAll('.file-item').forEach(item => {
                const name = item.querySelector('.fi-name').textContent.toLowerCase();
                item.style.display = name.includes(val) ? 'flex' : 'none';
            });
        });

        loadFiles();
    }

    function initExcel(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const cells = el.querySelectorAll('.excel-cell');
        const formulaBar = el.querySelector('.excel-formula-bar');
        const filenameInput = el.querySelector('.excel-filename');
        const btnSave = el.querySelector('.excel-save-btn');

        let cellData = {};
        let activeCellId = null;

        const evaluateFormula = (expr) => {
            if (!expr.startsWith('=')) return expr;
            let formula = expr.substring(1).toUpperCase();

            const sumRegex = /SUM\(([^)]+)\)/g;
            formula = formula.replace(sumRegex, (match, args) => {
                const parts = args.split(',');
                let total = 0;
                parts.forEach(p => {
                    const val = parseFloat(getCellValue(p.trim()));
                    if (!isNaN(val)) total += val;
                });
                return total;
            });

            const avgRegex = /AVERAGE\(([^)]+)\)/g;
            formula = formula.replace(avgRegex, (match, args) => {
                const parts = args.split(',');
                let total = 0, count = 0;
                parts.forEach(p => {
                    const val = parseFloat(getCellValue(p.trim()));
                    if (!isNaN(val)) { total += val; count++; }
                });
                return count > 0 ? (total / count) : 0;
            });

            const cellRefRegex = /[A-J][0-9]+/g;
            formula = formula.replace(cellRefRegex, (cellRef) => {
                const val = parseFloat(getCellValue(cellRef));
                return isNaN(val) ? 0 : val;
            });

            try {
                const res = Function('"use strict"; return (' + formula + ')')();
                return typeof res === 'number' ? parseFloat(res.toFixed(6)) : res;
            } catch (err) {
                return '#REF!';
            }
        };

        const getCellValue = (id) => {
            const entry = cellData[id];
            if (!entry) {
                const input = el.querySelector(`#cell-${id}`);
                return input ? input.value : "";
            }
            return entry.value;
        };

        const recalculateAll = () => {
            for (const id in cellData) {
                if (cellData[id].formula.startsWith('=')) {
                    cellData[id].value = evaluateFormula(cellData[id].formula);
                    const input = el.querySelector(`#cell-${id}`);
                    if (input) input.value = cellData[id].value;
                }
            }
        };

        cells.forEach(cell => {
            const id = cell.dataset.cellId;
            cellData[id] = { formula: "", value: "" };

            cell.addEventListener('focus', () => {
                activeCellId = id;
                formulaBar.value = cellData[id].formula || cell.value;
            });

            cell.addEventListener('blur', () => {
                const val = cell.value;
                if (!val.startsWith('=')) {
                    cellData[id].formula = val;
                    cellData[id].value = val;
                } else {
                    cellData[id].formula = val;
                }
                recalculateAll();
            });

            cell.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    cell.blur();
                }
            });
        });

        formulaBar.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && activeCellId) {
                const val = formulaBar.value;
                const input = el.querySelector(`#cell-${activeCellId}`);
                if (input) {
                    input.value = val;
                    cellData[activeCellId].formula = val;
                    if (!val.startsWith('=')) cellData[activeCellId].value = val;
                    input.blur();
                }
            }
        });

        btnSave.addEventListener('click', async () => {
            const filename = filenameInput.value.trim() || 'sheet.xlsx';
            let csvLines = [];
            for (let r = 1; r <= 15; r++) {
                let rowVals = [];
                for (let c = 0; c < 10; c++) {
                    const id = `${String.fromCharCode(65 + c)}${r}`;
                    rowVals.push(cellData[id].formula || cellData[id].value || "");
                }
                csvLines.push(rowVals.join(','));
            }
            const content = csvLines.join('\n');
            try {
                const res = await fetch('/api/files?action=write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: filename, content })
                });
                const data = await res.json();
                if (data.success) {
                    showSystemNotification("Microsoft Excel", `Successfully saved ${filename} to workspace root!`);
                }
            } catch (err) {
                showSystemNotification("Microsoft Excel", "Error saving sheet.");
            }
        });
    }

    function initPaint(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const canvas = el.querySelector('.paint-canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = el.querySelector('.paint-color-picker');
        const sizeSlider = el.querySelector('.paint-size-slider');
        const btnClear = el.querySelector('.paint-clear-btn');
        const btnSave = el.querySelector('.paint-save-btn');

        let isDrawing = false;
        let startX, startY;
        let tool = 'brush';
        let snapshot;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        el.querySelectorAll('.paint-tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                el.querySelectorAll('.paint-tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tool = btn.dataset.tool;
            });
        });

        const startDraw = (e) => {
            isDrawing = true;
            startX = e.offsetX;
            startY = e.clientY - canvas.getBoundingClientRect().top;
            ctx.beginPath();
            ctx.lineWidth = sizeSlider.value;
            ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : colorPicker.value;
            ctx.fillStyle = colorPicker.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        };

        const drawing = (e) => {
            if (!isDrawing) return;
            const currentY = e.clientY - canvas.getBoundingClientRect().top;

            if (tool === 'brush' || tool === 'eraser') {
                ctx.lineTo(e.offsetX, currentY);
                ctx.stroke();
            } else {
                ctx.putImageData(snapshot, 0, 0);

                if (tool === 'line') {
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(e.offsetX, currentY);
                    ctx.stroke();
                } else if (tool === 'rect') {
                    ctx.strokeRect(startX, startY, e.offsetX - startX, currentY - startY);
                } else if (tool === 'circle') {
                    ctx.beginPath();
                    const radius = Math.sqrt(Math.pow(startX - e.offsetX, 2) + Math.pow(startY - currentY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    ctx.stroke();
                }
            }
        };

        const stopDraw = () => {
            isDrawing = false;
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', drawing);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        btnClear.addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        btnSave.addEventListener('click', async () => {
            const dataUrl = canvas.toDataURL('image/png');
            const base64Content = dataUrl.replace(/^data:image\/png;base64,/, '');

            try {
                const res = await fetch('/api/files?action=write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: 'images/drawing.png',
                        content: base64Content,
                        is_base64: true
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showSystemNotification("Paint", "Successfully saved drawing!");
                }
            } catch (err) {
                showSystemNotification("Paint", "Error saving canvas.");
            }
        });
    }

                noFeed.style.display = 'none';
            })
            .catch(err => {
                console.log("Webcam declined: ", err);
            });

            flash.style.opacity = '1';

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 640;
            tempCanvas.height = 480;
            const tempCtx = tempCanvas.getContext('2d');

            if (streamInstance) {
                tempCtx.translate(640, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, 640, 480);
            } else {
                tempCtx.fillStyle = '#0a0a0c';
                tempCtx.fillRect(0, 0, 640, 480);
                tempCtx.fillStyle = '#ffef80';
                tempCtx.font = '20px sans-serif';
                tempCtx.fillText("Smile! Windows Camera Snapshot Mock Frame", 100, 240);
            }

            const dataUrl = tempCanvas.toDataURL('image/png');
            const base64Content = dataUrl.replace(/^data:image\/png;base64,/, '');

        const trackTitle = el.querySelector('.music-current-title');
        const btnPlay = el.querySelector('.music-ctrl-btn.btn-play');
        const progress = el.querySelector('.music-progress');
        const timeCurrent = el.querySelector('.music-time-current');

        let isPlaying = false;
        let progressVal = 20;
        let animationFrame;

        const tracks = [
            "Windows Startup Remix",
            "Synthwave Odyssey",
            "Acoustic Lofi Chill"
        ];

        el.querySelectorAll('.music-track-item').forEach(item => {
            item.addEventListener('click', () => {
                el.querySelectorAll('.music-track-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const idx = parseInt(item.dataset.trackId);
                trackTitle.textContent = tracks[idx];
                progressVal = 0;
                progress.value = 0;
                timeCurrent.textContent = '0:00';
            });
        });

        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.textContent = isPlaying ? '⏸' : '▶';
            btnPlay.style.background = isPlaying ? '#0078d4' : '#eacb64';
            btnPlay.style.color = isPlaying ? 'white' : 'black';

            if (isPlaying) {
                animateVisualizer();
            } else {
                cancelAnimationFrame(animationFrame);
                vCtx.clearRect(0, 0, visualizer.width, visualizer.height);
            }
        });

        const animateVisualizer = () => {
            vCtx.clearRect(0, 0, visualizer.width, visualizer.height);
            vCtx.fillStyle = '#eacb64';

            for (let i = 0; i < 24; i++) {
                const height = Math.random() * (visualizer.height - 10);
                const x = i * 13 + 4;
                vCtx.fillRect(x, visualizer.height - height, 8, height);
            }

            progressVal = (progressVal + 0.1) % 100;
            progress.value = Math.floor(progressVal);

            const minutes = Math.floor((progressVal * 2.2) / 60);
            const seconds = Math.floor((progressVal * 2.2) % 60);
            timeCurrent.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            animationFrame = requestAnimationFrame(animateVisualizer);
        };
    }

                        if (edgeApp) {
                            openApp(edgeApp);
                            setTimeout(() => {
                                const edgeInp = document.querySelector('.edge-url-input');
                                if (edgeInp) {
                                    edgeInp.value = url;
                                    edgeInp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
                                }
                            }, 500);
                        }
                    });
                    document.getElementById('desktop-icons').appendChild(shortcut);

                    // 2. Add to Start Menu apps grid
                    const pinnedApp = document.createElement('div');
                    pinnedApp.className = 'start-app-item';
                    if (logo.startsWith('http') || logo.startsWith('.') || logo.startsWith('/')) {
                        pinnedApp.innerHTML = `<div class="app-icon" style="width:24px; height:24px; display:flex; align-items:center; justify-content:center;"><img src="${logo}" style="width:100%; height:100%; object-fit:contain;"></div><div class="app-name">${name}</div>`;
                    } else {
                        pinnedApp.innerHTML = `<div class="app-icon">${logo}</div><div class="app-name">${name}</div>`;
                    }
                    pinnedApp.addEventListener('click', () => {
                        showSystemNotification(name, `Launching ${name}...`);
                        closeAllPanels();
                        const edgeApp = APPS.find(a => a.id === 'edge');
                        if (edgeApp) {
                            openApp(edgeApp);
                            setTimeout(() => {
                                const edgeInp = document.querySelector('.edge-url-input');
                                if (edgeInp) {
                                    edgeInp.value = url;
                                    edgeInp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
                                }
                            }, 500);
                        }
                    });
                    document.getElementById('start-apps-grid').appendChild(pinnedApp);

                    // Register custom app in global dynamic APPS array
                    const newAppId = `custom-${Date.now()}`;
                    APPS.push({
                        id: newAppId,
                        name: name,
                        icon: logo.startsWith('http') ? '⭐' : logo,
                        pinned: true,
                        type: 'browser',
                        customUrl: url
                    });

                    showSystemNotification("Microsoft Store", `Custom web application "${name}" successfully registered and pinned!`);
                }, 1000);
            });
        }
    }

    function initCalendar(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const grid = el.querySelector('.calendar-days-grid');
        const noteInput = el.querySelector('.cal-note-input');
        const noteSave = el.querySelector('.cal-note-save-btn');

        let selectedDay = null;
        let dayEvents = {};

        const renderDays = () => {
            grid.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const day = document.createElement('div');
                day.style.cssText = `
                    background: #252525; border: 1px solid #333; border-radius: 4px;
                    padding: 4px; cursor: pointer; display: flex; flex-direction: column;
                    justify-content: space-between; font-size: 11px;
                `;
                day.innerHTML = `<div style="font-weight:600;">${i}</div>`;

                if (dayEvents[i]) {
                    const preview = document.createElement('div');
                    preview.style.cssText = 'font-size:9px; background:#0078d4; color:white; padding:1px 4px; border-radius:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;';
                    preview.textContent = dayEvents[i];
                    day.appendChild(preview);
                }

                if (i === selectedDay) {
                    day.style.border = '2px solid #0078d4';
                }

                day.addEventListener('click', () => {
                    selectedDay = i;
                    noteInput.value = dayEvents[i] || '';
                    renderDays();
                });

                grid.appendChild(day);
            }
        };

        noteSave.addEventListener('click', () => {
            if (selectedDay) {
                dayEvents[selectedDay] = noteInput.value.trim();
                renderDays();
                showSystemNotification("Calendar", `Saved event for Day ${selectedDay}!`);
            }
        });

        renderDays();
    }

    function initSnipping(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const canvas = el.querySelector('.snipping-canvas');
        const ctx = canvas.getContext('2d');
        const btnNew = el.querySelector('.snip-new-btn');
        const btnSave = el.querySelector('.snip-save-btn');
        const overlay = el.querySelector('.snipping-overlay-msg');

        let isSnipping = false;
        let activeColor = '#ff4500';

        ctx.fillStyle = '#1e1e2d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        el.querySelectorAll('.snip-pen-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                el.querySelectorAll('.snip-pen-btn').forEach(b => b.style.border = 'none');
                btn.style.border = '2px solid white';
                activeColor = btn.dataset.color;
            });
        });

        btnNew.addEventListener('click', () => {
            overlay.style.display = 'none';
            ctx.fillStyle = '#2d2d2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw dummy captured screen mockup visually!
            ctx.fillStyle = '#0078d4';
            ctx.fillRect(100, 80, 400, 200);
            ctx.fillStyle = 'white';
            ctx.font = '16px sans-serif';
            ctx.fillText("Windows 11 Snip Area Capture Mockup", 140, 180);
            showSystemNotification("Snipping Tool", "Captured active screen segment. You can annotate with colored pens!");
        });

        canvas.addEventListener('mousedown', (e) => {
            isSnipping = true;
            ctx.beginPath();
            ctx.strokeStyle = activeColor;
            ctx.lineWidth = 3;
            ctx.moveTo(e.offsetX, e.clientY - canvas.getBoundingClientRect().top);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isSnipping) return;
            ctx.lineTo(e.offsetX, e.clientY - canvas.getBoundingClientRect().top);
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => { isSnipping = false; });

        btnSave.addEventListener('click', () => {
            showSystemNotification("Snipping Tool", "Saved capture snip successfully!");
        });
    }

    function initMediaPlayer(winId) {
        const el = document.getElementById(`window-${winId}`);
        if (!el) return;
        const disc = el.querySelector('.player-disc');
        const playBtn = el.querySelector('.btn-player-play');
        const progress = el.querySelector('.player-progress-bar');
        const curTime = el.querySelector('.player-current-time');

        let isPlaying = false;
        let progressVal = 0;
        let timer;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '⏸' : '▶';

            if (isPlaying) {
                disc.style.animation = 'spin 3s linear infinite';
                timer = setInterval(() => {
                    progressVal = (progressVal + 1) % 100;
                    progress.value = progressVal;
                    const mins = Math.floor((progressVal * 1.8) / 60);
                    const secs = Math.floor((progressVal * 1.8) % 60);
                    curTime.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }, 1000);
            } else {
                disc.style.animation = 'none';
                clearInterval(timer);
            }
        });
    }

    // ===== WIDGETS =====
    function initWidgets() {
        const panel = document.getElementById('widget-panel');

        // Weather
        const weatherHtml = `
            <div class="widget-card">
                <div class="widget-card-header"><span>WEATHER</span></div>
                <div class="weather-widget-body">
                    <div class="weather-sun"></div>
                    <div class="weather-info">
                        <div class="weather-temp">22°C</div>
                        <div class="weather-desc">Sunny</div>
                        <div class="weather-loc">New York, NY</div>
                    </div>
                </div>
            </div>
        `;

        // Calendar
        const now = new Date();
        const monthName = now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const prevMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();

        let calDays = '';
        const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        dayNames.forEach(d => { calDays += `<div class="day-name">${d}</div>`; });

        for (let i = firstDay - 1; i >= 0; i--) {
            calDays += `<div class="day other-month">${prevMonthDays - i}</div>`;
        }
        for (let i = 1; i <= daysInMonth; i++) {
            const isToday = i === now.getDate() ? ' today' : '';
            calDays += `<div class="day${isToday}">${i}</div>`;
        }
        const remaining = 42 - (firstDay + daysInMonth);
        for (let i = 1; i <= remaining; i++) {
            calDays += `<div class="day other-month">${i}</div>`;
        }

        const calendarHtml = `
            <div class="widget-card">
                <div class="widget-card-header"><span>CALENDAR</span></div>
                <div class="calendar-widget-body">
                    <div class="cal-month">${monthName}</div>
                    <div class="cal-grid">${calDays}</div>
                </div>
            </div>
        `;

        // Todo
        const todoHtml = `
            <div class="widget-card">
                <div class="widget-card-header"><span>TO-DO</span></div>
                <div class="widget-todo" id="widget-todo">
                    <div class="todo-item"><div class="todo-check" onclick="this.classList.toggle('checked')"></div><span>Review project proposal</span></div>
                    <div class="todo-item"><div class="todo-check checked" onclick="this.classList.toggle('checked')"></div><span>Update Windows 11</span></div>
                    <div class="todo-item"><div class="todo-check" onclick="this.classList.toggle('checked')"></div><span>Check email</span></div>
                    <div class="todo-input-row">
                        <input placeholder="Add a task..." id="todo-new-input">
                        <button onclick="addTodo()">Add</button>
                    </div>
                </div>
            </div>
        `;

        panel.innerHTML = weatherHtml + calendarHtml + todoHtml;
    }

    // ===== CONTEXT MENU =====
    function initContextMenu() {
        document.getElementById('desktop').addEventListener('contextmenu', (e) => {
            e.preventDefault();
            closeAllPanels();

            const menu = document.getElementById('context-menu');
            menu.innerHTML = `
                <div class="ctx-item" onclick="contextAction('view')"><span class="ctx-icon">👁️</span>View<span class="ctx-shortcut"></span></div>
                <div class="ctx-item" onclick="contextAction('sort')"><span class="ctx-icon">📊</span>Sort by<span class="ctx-shortcut"></span></div>
                <div class="ctx-item" onclick="contextAction('refresh')"><span class="ctx-icon">🔄</span>Refresh<span class="ctx-shortcut"></span></div>
                <div class="ctx-separator"></div>
                <div class="ctx-item" onclick="contextAction('new')"><span class="ctx-icon">📄</span>New<span class="ctx-shortcut"></span></div>
                <div class="ctx-separator"></div>
                <div class="ctx-item" onclick="contextAction('display')"><span class="ctx-icon">🖥️</span>Display settings<span class="ctx-shortcut"></span></div>
                <div class="ctx-item" onclick="contextAction('personalize')"><span class="ctx-icon">🎨</span>Personalize<span class="ctx-shortcut"></span></div>
                <div class="ctx-separator"></div>
                <div class="ctx-item" onclick="contextAction('terminal')"><span class="ctx-icon">💻</span>Open in Terminal<span class="ctx-shortcut"></span></div>
                <div class="ctx-item" onclick="contextAction('properties')"><span class="ctx-icon">⚙️</span>Properties<span class="ctx-shortcut"></span></div>
            `;

            let x = e.clientX, y = e.clientY;
            if (x + 220 > window.innerWidth) x = window.innerWidth - 220;
            if (y + 350 > window.innerHeight) y = window.innerHeight - 350;

            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            contextMenuOpen = true;
            menu.classList.add('open');
        });

        document.addEventListener('click', () => {
            if (contextMenuOpen) closePanel('context');
        });
    }

    window.contextAction = function(action) {
        closePanel('context');
        if (action === 'terminal') {
            const app = APPS.find(a => a.id === 'terminal');
            if (app) openApp(app);
        } else if (action === 'personalize' || action === 'display') {
            const app = APPS.find(a => a.id === 'settings');
            if (app) openApp(app);
        }
    };

    // ===== POWER MENU =====
    function initPowerMenu() {
        document.getElementById('start-power').addEventListener('click', (e) => {
            e.stopPropagation();
            powerMenuOpen = !powerMenuOpen;
            const pm = document.getElementById('power-menu');
            const rect = e.currentTarget.getBoundingClientRect();
            pm.style.left = (rect.left - 60) + 'px';
            pm.style.top = (rect.top - 130) + 'px';
            pm.classList.toggle('open', powerMenuOpen);
        });

        document.querySelectorAll('.power-item').forEach(item => {
            item.addEventListener('click', () => {
                const action = item.dataset.action;
                closeAllPanels();
                if (action === 'shutdown' || action === 'restart') {
                    const ss = document.getElementById('shutdown-screen');
                    ss.querySelector('.shutdown-text').textContent =
                        action === 'shutdown' ? 'Shutting down...' : 'Restarting...';
                    ss.classList.add('active');
                    if (action === 'restart') {
                        setTimeout(() => { location.reload(); }, 3000);
                    }
                }
            });
        });
    }

    // ===== SELECTION RECT =====
    function initSelectionRect() {
        const desktop = document.getElementById('desktop');
        const rect = document.getElementById('selection-rect');
        let isSelecting = false;
        let startX, startY;

        desktop.addEventListener('mousedown', (e) => {
            if (e.target.closest('.app-window') || e.target.closest('.desktop-icon') ||
                e.target.closest('#taskbar') || e.button !== 0) return;

            closeAllPanels();
            document.querySelectorAll('.desktop-icon').forEach(d => d.classList.remove('selected'));

            isSelecting = true;
            startX = e.clientX;
            startY = e.clientY;
            rect.style.left = startX + 'px';
            rect.style.top = startY + 'px';
            rect.style.width = '0px';
            rect.style.height = '0px';
            rect.style.display = 'block';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;
            const x = Math.min(startX, e.clientX);
            const y = Math.min(startY, e.clientY);
            const w = Math.abs(e.clientX - startX);
            const h = Math.abs(e.clientY - startY);
            rect.style.left = x + 'px';
            rect.style.top = y + 'px';
            rect.style.width = w + 'px';
            rect.style.height = h + 'px';
        });

        document.addEventListener('mouseup', () => {
            if (isSelecting) {
                isSelecting = false;
                rect.style.display = 'none';
            }
        });
    }

    // ===== CLICK OUTSIDE TO CLOSE =====
    document.addEventListener('mousedown', (e) => {
        if (startMenuOpen && !e.target.closest('#start-menu') && !e.target.closest('#tb-start')) closePanel('start');
        if (searchPanelOpen && !e.target.closest('#search-panel') && !e.target.closest('#tb-search')) closePanel('search');
        if (widgetPanelOpen && !e.target.closest('#widget-panel') && !e.target.closest('#tb-widgets')) closePanel('widget');
        if (notifCenterOpen && !e.target.closest('#notification-center') && !e.target.closest('#clock-section') && !e.target.closest('#tray-icons')) closePanel('notif');
        if (powerMenuOpen && !e.target.closest('#power-menu') && !e.target.closest('#start-power')) closePanel('power');
    });

    // ===== KEYBOARD SHORTCUTS =====
    document.addEventListener('keydown', (e) => {
        // Win key (Meta) - toggle start menu
        if (e.key === 'Meta' || (e.key === 'Escape' && startMenuOpen)) {
            e.preventDefault();
            if (startMenuOpen) closePanel('start');
            else toggleStartMenu();
        }
        // Escape to close panels
        if (e.key === 'Escape') {
            closeAllPanels();
        }
    });

    // ===== TOOLTIPS =====
    function initTooltips() {
        const tooltip = document.getElementById('tooltip');
        document.querySelectorAll('[data-tooltip]').forEach(el => {
            el.addEventListener('mouseenter', (e) => {
                tooltip.textContent = el.dataset.tooltip;
                const rect = el.getBoundingClientRect();
                tooltip.style.left = (rect.left + rect.width / 2 - tooltip.offsetWidth / 2) + 'px';
                tooltip.style.top = (rect.top - 32) + 'px';
                tooltip.classList.add('visible');
            });
            el.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
            });
        });
    }

    // ===== BRIGHTNESS =====
    document.getElementById('brightness-slider').addEventListener('input', (e) => {
        document.getElementById('desktop').style.filter = `brightness(${e.target.value / 100})`;
    });

    // ===== INIT =====
    function init() {
        VFS.init().then(() => {
            bootSequence();
            updateClock();
            initDesktopIcons();
            initStartMenu();
            initSearch();
            initTaskbar();
            initWidgets();
            initNotifications();
            initContextMenu();
            initPowerMenu();
            initSelectionRect();
            setTimeout(initTooltips, 100);
        }).catch(err => {
            console.error("VFS Initialization Failed: ", err);
            // Fallback boot
            bootSequence();
            updateClock();
            initDesktopIcons();
        });
    }

    init();

})();
