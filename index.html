<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #0078d4;
            --accent-light: #60cdff;
            --nav-height: 48px;
            --glass-bg: rgba(32, 32, 32, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-light: rgba(255, 255, 255, 0.12);
            --hover-bg: rgba(255, 255, 255, 0.06);
            --active-bg: rgba(255, 255, 255, 0.04);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --start-bg: rgba(44, 44, 44, 0.92);
            --search-bg: rgba(30, 30, 30, 0.95);
            --widget-bg: rgba(32, 32, 42, 0.85);
        }
        body {
            font-family: 'Segoe UI', 'Inter', -apple-system, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            background: #000;
            user-select: none;
            cursor: default;
        }
        body.light-theme {
            --glass-bg: rgba(243, 243, 243, 0.85);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-border-light: rgba(0, 0, 0, 0.12);
            --hover-bg: rgba(0, 0, 0, 0.06);
            --active-bg: rgba(0, 0, 0, 0.04);
            --text-primary: #000000;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --start-bg: rgba(243, 243, 243, 0.95);
            --search-bg: rgba(240, 240, 240, 0.98);
            --widget-bg: rgba(243, 243, 250, 0.9);
        }

        /* ===== LOCK SCREEN ===== */
        #lock-screen {
            position: fixed; inset: 0; z-index: 10000;
            background: url('./images/1dark.jpg') center/cover;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        #lock-screen.unlocked {
            transform: translateY(-100%);
            opacity: 0;
        }
        #lock-screen::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.15);
        }
        .lock-time {
            position: relative; z-index: 1;
            color: white; text-align: center;
            margin-bottom: auto; margin-top: 15vh;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .lock-time .time { font-size: 96px; font-weight: 600; line-height: 1; }
        .lock-time .date { font-size: 18px; font-weight: 400; margin-top: 4px; }
        .lock-hint {
            position: relative; z-index: 1;
            color: white; font-size: 14px;
            margin-bottom: 60px; opacity: 0.8;
            animation: lockPulse 2s ease-in-out infinite;
        }
        @keyframes lockPulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }

        /* ===== LOGIN SCREEN ===== */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: url('./images/1dark.jpg') center/cover;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; pointer-events: none;
        }
        #login-screen.visible { opacity: 1; pointer-events: all; }
        #login-screen.hidden { opacity: 0; pointer-events: none; }
        #login-screen::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(30px);
        }
        .login-container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }
        .login-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            display: flex; align-items: center; justify-content: center;
            font-size: 48px; color: white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .login-name { color: white; font-size: 22px; font-weight: 500; }
        .login-input {
            width: 260px; height: 36px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-bottom: 2px solid var(--accent-light);
            border-radius: 4px; color: white;
            padding: 0 12px; font-size: 14px;
            font-family: inherit; outline: none;
            backdrop-filter: blur(10px);
        }
        .login-input::placeholder { color: rgba(255,255,255,0.5); }
        .login-btn {
            width: 260px; height: 36px;
            background: var(--accent);
            border: none; border-radius: 4px;
            color: white; font-size: 14px;
            font-family: inherit; cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #1a86d9; }

        /* ===== BOOT SCREEN ===== */
        #boot-screen {
            position: fixed; inset: 0; z-index: 9998;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        #boot-screen.hidden { opacity: 0; pointer-events: none; }
        .boot-logo {
            width: 80px; height: 80px;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .boot-logo div {
            background: #0078d4;
            animation: bootPulse 1.5s ease-in-out infinite;
        }
        .boot-logo div:nth-child(2) { animation-delay: 0.15s; }
        .boot-logo div:nth-child(3) { animation-delay: 0.3s; }
        .boot-logo div:nth-child(4) { animation-delay: 0.45s; }
        @keyframes bootPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        .boot-spinner {
            margin-top: 40px;
            width: 30px; height: 30px;
            border: 3px solid transparent;
            border-top: 3px solid #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== DESKTOP ===== */
        #desktop {
            height: 100vh; width: 100vw;
            background: url('./images/1dark.jpg') center/cover no-repeat;
            position: relative;
            transition: background-image 0.5s;
        }

        /* Desktop Icons */
        #desktop-icons {
            position: absolute; top: 12px; left: 12px;
            display: flex; flex-direction: column; flex-wrap: wrap;
            gap: 4px; max-height: calc(100vh - 60px);
            align-content: flex-start;
        }
        .desktop-icon {
            width: 76px; padding: 8px 4px;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            border-radius: 4px; cursor: pointer;
            transition: background 0.1s;
        }
        .desktop-icon:hover { background: rgba(255,255,255,0.08); }
        .desktop-icon.selected { background: rgba(0,120,212,0.3); outline: 1px solid rgba(0,120,212,0.5); }
        .desktop-icon .icon {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        .desktop-icon .label {
            font-size: 11px; color: white;
            text-align: center; line-height: 1.2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            word-break: break-word;
            max-width: 72px;
        }

        /* ===== TASKBAR ===== */
        #taskbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--nav-height);
            background: rgba(32, 32, 32, 0.8);
            backdrop-filter: blur(60px) saturate(180%);
            border-top: 1px solid var(--glass-border);
            display: flex; align-items: center;
            justify-content: center;
            z-index: 900;
            padding: 0 8px;
        }
        #taskbar-center {
            display: flex; align-items: center;
            height: 100%; gap: 2px;
        }
        .taskbar-btn {
            height: 40px; min-width: 40px;
            display: flex; align-items: center;
            justify-content: center;
            border-radius: 4px; cursor: pointer;
            transition: all 0.15s; padding: 0 4px;
            position: relative;
        }
        .taskbar-btn:hover { background: var(--hover-bg); }
        .taskbar-btn:active { background: var(--active-bg); transform: scale(0.95); }
        .taskbar-btn svg, .taskbar-btn .tb-icon {
            width: 22px; height: 22px; fill: white;
        }
        .taskbar-btn .tb-icon { font-size: 20px; text-align: center; line-height: 22px; }
        .taskbar-btn.active::after {
            content: ''; position: absolute; bottom: 2px;
            left: 50%; transform: translateX(-50%);
            width: 16px; height: 3px;
            background: var(--accent-light);
            border-radius: 2px;
        }
        .taskbar-btn.running::after {
            content: ''; position: absolute; bottom: 2px;
            left: 50%; transform: translateX(-50%);
            width: 6px; height: 3px;
            background: rgba(255,255,255,0.5);
            border-radius: 2px;
        }
        .taskbar-btn.active.running::after {
            width: 16px;
            background: var(--accent-light);
        }

        /* Taskbar Right */
        #taskbar-right {
            position: absolute; right: 0;
            display: flex; align-items: center;
            height: 100%; gap: 0;
        }
        .tray-section {
            display: flex; align-items: center;
            height: 36px; padding: 0 8px;
            border-radius: 4px; cursor: pointer;
            transition: background 0.15s; gap: 6px;
        }
        .tray-section:hover { background: var(--hover-bg); }
        .tray-section svg { width: 16px; height: 16px; fill: var(--text-primary); }
        .clock-section {
            display: flex; flex-direction: column;
            align-items: flex-end; justify-content: center;
            height: 36px; padding: 0 12px;
            border-radius: 4px; cursor: pointer;
            transition: background 0.15s;
        }
        .clock-section:hover { background: var(--hover-bg); }
        .clock-time { font-size: 12px; color: var(--text-primary); line-height: 1.3; }
        .clock-date { font-size: 12px; color: var(--text-primary); line-height: 1.3; }

        /* ===== START MENU ===== */
        #start-menu {
            position: fixed;
            bottom: calc(var(--nav-height) + 12px);
            left: 50%; transform: translateX(-50%) translateY(20px);
            width: 640px;
            background: rgba(44, 44, 44, 0.94);
            backdrop-filter: blur(60px) saturate(180%);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px;
            color: var(--text-primary);
            z-index: 950;
            opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 16px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }
        #start-menu.open {
            opacity: 1; pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }
        .start-search {
            padding: 20px 24px 0;
        }
        .start-search input {
            width: 100%; height: 36px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom: 2px solid var(--accent-light);
            border-radius: 4px; color: white;
            padding: 0 12px 0 36px; font-size: 14px;
            font-family: inherit; outline: none;
        }
        .start-search { position: relative; }
        .start-search svg {
            position: absolute; left: 36px; top: 28px;
            width: 16px; height: 16px; fill: var(--text-tertiary);
            pointer-events: none;
        }
        .start-search input::placeholder { color: var(--text-tertiary); }
        .start-section { padding: 16px 24px; }
        .start-section-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 12px;
        }
        .start-section-header h3 { font-size: 14px; font-weight: 600; }
        .start-section-header button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; color: var(--text-secondary);
            padding: 4px 12px; font-size: 12px;
            font-family: inherit; cursor: pointer;
            transition: background 0.15s;
        }
        .start-section-header button:hover { background: rgba(255,255,255,0.1); }
        .start-apps-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
        }
        .start-app-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            padding: 12px 8px; border-radius: 4px;
            cursor: pointer; transition: background 0.15s;
        }
        .start-app-item:hover { background: rgba(255,255,255,0.06); }
        .start-app-item:active { background: rgba(255,255,255,0.03); transform: scale(0.97); }
        .start-app-item .app-icon { font-size: 28px; line-height: 1; }
        .start-app-item .app-name {
            font-size: 11px; color: var(--text-secondary);
            text-align: center; line-height: 1.2;
        }
        .start-recommended {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .start-rec-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 4px;
            cursor: pointer; transition: background 0.15s;
        }
        .start-rec-item:hover { background: rgba(255,255,255,0.06); }
        .start-rec-item .rec-icon { font-size: 24px; }
        .start-rec-item .rec-info .rec-name { font-size: 13px; }
        .start-rec-item .rec-info .rec-time { font-size: 11px; color: var(--text-tertiary); }
        .start-footer {
            display: flex; justify-content: space-between;
            align-items: center; padding: 12px 24px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--glass-border);
        }
        .start-user {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 10px; border-radius: 4px;
            cursor: pointer; transition: background 0.15s;
        }
        .start-user:hover { background: rgba(255,255,255,0.06); }
        .start-user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #0078d4, #00bcf2);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .start-user-name { font-size: 13px; }
        .start-power {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; cursor: pointer;
            transition: background 0.15s;
        }
        .start-power:hover { background: rgba(255,255,255,0.06); }
        .start-power svg { width: 18px; height: 18px; fill: var(--text-primary); }

        /* ===== SEARCH PANEL ===== */
        #search-panel {
            position: fixed;
            bottom: calc(var(--nav-height) + 12px);
            left: 50%; transform: translateX(-50%) translateY(20px);
            width: 640px; height: 500px;
            background: rgba(44, 44, 44, 0.94);
            backdrop-filter: blur(60px) saturate(180%);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px;
            color: var(--text-primary);
            z-index: 950;
            opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 16px 60px rgba(0,0,0,0.5);
            overflow: hidden; display: flex; flex-direction: column;
        }
        #search-panel.open {
            opacity: 1; pointer-events: all;
            transform: translateX(-50%) translateY(0);
        }
        .search-top { padding: 20px 24px; }
        .search-top input {
            width: 100%; height: 40px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-bottom: 2px solid var(--accent-light);
            border-radius: 4px; color: white;
            padding: 0 12px 0 40px; font-size: 15px;
            font-family: inherit; outline: none;
        }
        .search-top { position: relative; }
        .search-top svg {
            position: absolute; left: 36px; top: 30px;
            width: 18px; height: 18px; fill: var(--text-tertiary);
            pointer-events: none;
        }
        .search-top input::placeholder { color: var(--text-tertiary); }
        .search-body {
            flex: 1; padding: 0 24px 24px;
            overflow-y: auto;
        }
        .search-category { margin-bottom: 16px; }
        .search-category h4 { font-size: 13px; color: var(--text-tertiary); margin-bottom: 8px; font-weight: 500; }
        .search-results { display: flex; flex-direction: column; gap: 2px; }
        .search-result-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 4px;
            cursor: pointer; transition: background 0.15s;
        }
        .search-result-item:hover { background: rgba(255,255,255,0.06); }
        .search-result-item .sr-icon { font-size: 20px; width: 28px; text-align: center; }
        .search-result-item .sr-name { font-size: 13px; }

        /* ===== WIDGETS ===== */
        #widget-panel {
            position: fixed;
            top: 0; left: 0; bottom: var(--nav-height);
            width: 420px;
            background: rgba(32, 32, 42, 0.92);
            backdrop-filter: blur(60px) saturate(180%);
            border-right: 1px solid var(--glass-border-light);
            color: var(--text-primary);
            z-index: 940;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto; padding: 16px;
        }
        #widget-panel.open { transform: translateX(0); }
        .widget-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px; margin-bottom: 12px;
            overflow: hidden;
        }
        .widget-card-header {
            padding: 12px 16px;
            display: flex; justify-content: space-between;
            align-items: center; font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-tertiary); font-weight: 600;
        }
        .weather-widget-body {
            padding: 16px; display: flex;
            align-items: center; gap: 20px;
        }
        .weather-sun {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #ffef80, #ecaa00);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(236,170,0,0.4);
            flex-shrink: 0;
        }
        .weather-info .weather-temp { font-size: 42px; font-weight: 300; }
        .weather-info .weather-desc { font-size: 13px; color: var(--text-secondary); }
        .weather-info .weather-loc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
        .widget-todo { padding: 12px 16px; }
        .todo-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 0; border-bottom: 1px solid var(--glass-border);
            font-size: 13px;
        }
        .todo-item:last-child { border: none; }
        .todo-check {
            width: 18px; height: 18px;
            border: 2px solid var(--text-tertiary);
            border-radius: 50%; cursor: pointer;
            flex-shrink: 0; transition: all 0.2s;
        }
        .todo-check.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .todo-check.checked + span { text-decoration: line-through; opacity: 0.5; }
        .todo-input-row { display: flex; gap: 8px; margin-top: 8px; }
        .todo-input-row input {
            flex: 1; height: 32px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; color: white;
            padding: 0 10px; font-size: 13px;
            font-family: inherit; outline: none;
        }
        .todo-input-row input::placeholder { color: var(--text-tertiary); }
        .todo-input-row button {
            height: 32px; padding: 0 14px;
            background: var(--accent); border: none;
            border-radius: 4px; color: white;
            font-size: 13px; cursor: pointer;
            font-family: inherit;
        }
        .calendar-widget-body { padding: 12px 16px; }
        .cal-month { text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .cal-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 2px; text-align: center; font-size: 12px;
        }
        .cal-grid .day-name { color: var(--text-tertiary); padding: 4px; font-weight: 600; }
        .cal-grid .day {
            padding: 4px; border-radius: 50%;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            margin: auto; cursor: pointer; transition: background 0.15s;
        }
        .cal-grid .day:hover { background: rgba(255,255,255,0.1); }
        .cal-grid .day.today { background: var(--accent); font-weight: 700; }
        .cal-grid .day.other-month { color: var(--text-tertiary); }

        /* ===== NOTIFICATION CENTER ===== */
        #notification-center {
            position: fixed;
            bottom: calc(var(--nav-height) + 12px);
            right: 12px; width: 360px;
            background: rgba(44, 44, 44, 0.94);
            backdrop-filter: blur(60px) saturate(180%);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px;
            color: var(--text-primary);
            z-index: 950;
            opacity: 0; pointer-events: none;
            transform: translateY(20px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 16px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #notification-center.open {
            opacity: 1; pointer-events: all;
            transform: translateY(0);
        }
        .notif-header { padding: 16px; font-size: 14px; font-weight: 600; }
        .notif-items { padding: 0 12px 12px; max-height: 200px; overflow-y: auto; }
        .notif-item {
            padding: 12px; border-radius: 4px;
            background: rgba(255,255,255,0.04);
            margin-bottom: 4px; cursor: pointer;
            transition: background 0.15s;
        }
        .notif-item:hover { background: rgba(255,255,255,0.08); }
        .notif-item .ni-title { font-size: 13px; font-weight: 600; }
        .notif-item .ni-body { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .notif-item .ni-time { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
        .quick-actions {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 4px; padding: 12px;
            border-top: 1px solid var(--glass-border);
        }
        .quick-action {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            padding: 10px 4px; border-radius: 4px;
            cursor: pointer; transition: all 0.15s;
        }
        .quick-action:hover { background: rgba(255,255,255,0.06); }
        .quick-action.on { background: var(--accent); }
        .quick-action .qa-icon { font-size: 18px; }
        .quick-action .qa-label { font-size: 10px; color: var(--text-secondary); }
        .quick-action.on .qa-label { color: white; }
        .quick-sliders { padding: 8px 16px 16px; }
        .quick-slider { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .quick-slider svg { width: 16px; height: 16px; fill: var(--text-secondary); flex-shrink: 0; }
        .quick-slider input[type="range"] {
            flex: 1; height: 4px; -webkit-appearance: none;
            background: rgba(255,255,255,0.2); border-radius: 2px;
            outline: none;
        }
        .quick-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: white; cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ===== CONTEXT MENU ===== */
        #context-menu {
            position: fixed; z-index: 2000;
            background: rgba(44, 44, 44, 0.96);
            backdrop-filter: blur(60px) saturate(180%);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px; padding: 4px;
            min-width: 200px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            opacity: 0; pointer-events: none;
            transform: scale(0.95);
            transition: all 0.12s ease;
        }
        #context-menu.open { opacity: 1; pointer-events: all; transform: scale(1); }
        .ctx-item {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 16px; border-radius: 4px;
            cursor: pointer; font-size: 13px;
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .ctx-item:hover { background: rgba(255,255,255,0.06); }
        .ctx-item .ctx-icon { width: 20px; text-align: center; font-size: 14px; }
        .ctx-item .ctx-shortcut { margin-left: auto; font-size: 11px; color: var(--text-tertiary); }
        .ctx-separator { height: 1px; background: var(--glass-border); margin: 4px 8px; }

        /* ===== WINDOW ===== */
        .app-window {
            position: absolute;
            background: rgba(32, 32, 32, 0.95);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
            display: flex; flex-direction: column;
            min-width: 320px; min-height: 200px;
            z-index: 100;
            transition: box-shadow 0.2s;
        }
        .app-window.focused {
            box-shadow: 0 12px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
            z-index: 200;
        }
        .app-window.maximized {
            top: 0 !important; left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - var(--nav-height)) !important;
            border-radius: 0; border: none;
        }
        .app-window.minimized {
            transform: scale(0.8) translateY(100px);
            opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .app-window.opening {
            animation: windowOpen 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes windowOpen {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .app-window.closing {
            animation: windowClose 0.2s ease forwards;
        }
        @keyframes windowClose {
            to { transform: scale(0.9); opacity: 0; }
        }

        /* Window Title Bar */
        .win-titlebar {
            height: 32px; display: flex;
            align-items: center; justify-content: space-between;
            background: rgba(32, 32, 32, 0.98);
            flex-shrink: 0; cursor: default;
            -webkit-app-region: drag;
        }
        .win-titlebar-left {
            display: flex; align-items: center;
            gap: 8px; padding-left: 12px;
            font-size: 12px; color: var(--text-secondary);
            pointer-events: none;
        }
        .win-titlebar-left .win-icon { font-size: 14px; }
        .win-controls {
            display: flex; height: 100%;
        }
        .win-ctrl-btn {
            width: 46px; height: 100%;
            display: flex; align-items: center;
            justify-content: center; cursor: pointer;
            transition: background 0.1s;
        }
        .win-ctrl-btn:hover { background: rgba(255,255,255,0.08); }
        .win-ctrl-btn.close:hover { background: #c42b1c; }
        .win-ctrl-btn svg { width: 12px; height: 12px; fill: var(--text-secondary); }
        .win-ctrl-btn.close:hover svg { fill: white; }

        /* Window Body */
        .win-body {
            flex: 1; overflow: auto; color: var(--text-primary);
        }

        /* Resize Handles */
        .resize-handle {
            position: absolute; z-index: 10;
        }
        .resize-handle.top { top: -3px; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
        .resize-handle.bottom { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
        .resize-handle.left { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
        .resize-handle.right { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
        .resize-handle.top-left { top: -3px; left: -3px; width: 12px; height: 12px; cursor: nw-resize; }
        .resize-handle.top-right { top: -3px; right: -3px; width: 12px; height: 12px; cursor: ne-resize; }
        .resize-handle.bottom-left { bottom: -3px; left: -3px; width: 12px; height: 12px; cursor: sw-resize; }
        .resize-handle.bottom-right { bottom: -3px; right: -3px; width: 12px; height: 12px; cursor: se-resize; }

        /* ===== APP SPECIFIC STYLES ===== */

        /* File Explorer */
        .file-explorer { display: flex; height: 100%; }
        .file-sidebar {
            width: 200px; background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--glass-border);
            padding: 8px 0; flex-shrink: 0;
            overflow-y: auto;
        }
        .file-sidebar-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 16px; cursor: pointer;
            font-size: 13px; transition: background 0.1s;
        }
        .file-sidebar-item:hover { background: rgba(255,255,255,0.06); }
        .file-sidebar-item.active { background: rgba(0,120,212,0.2); }
        .file-sidebar-item .fsi-icon { font-size: 16px; width: 20px; text-align: center; }
        .file-sidebar-label { font-size: 11px; color: var(--text-tertiary); padding: 12px 16px 4px; text-transform: uppercase; font-weight: 600; }
        .file-content { flex: 1; padding: 12px; overflow-y: auto; }
        .file-toolbar {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 12px; border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .file-toolbar-btn {
            padding: 4px 10px; border-radius: 4px;
            font-size: 12px; color: var(--text-secondary);
            cursor: pointer; transition: background 0.1s;
        }
        .file-toolbar-btn:hover { background: rgba(255,255,255,0.06); }
        .file-address {
            flex: 1; margin: 0 8px;
            height: 28px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; color: var(--text-secondary);
            padding: 0 10px; font-size: 12px; display: flex;
            align-items: center;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 4px;
        }
        .file-item {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            padding: 12px 8px; border-radius: 4px;
            cursor: pointer; transition: background 0.1s;
        }
        .file-item:hover { background: rgba(255,255,255,0.06); }
        .file-item .fi-icon { font-size: 32px; }
        .file-item .fi-name { font-size: 11px; text-align: center; color: var(--text-secondary); word-break: break-word; }

        /* Settings */
        .settings-layout { display: flex; height: 100%; }
        .settings-sidebar {
            width: 240px; background: rgba(0,0,0,0.15);
            border-right: 1px solid var(--glass-border);
            padding: 16px 0; flex-shrink: 0;
            overflow-y: auto;
        }
        .settings-sidebar-title {
            padding: 8px 20px; font-size: 20px;
            font-weight: 600; margin-bottom: 8px;
        }
        .settings-nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 20px; cursor: pointer;
            font-size: 13px; transition: background 0.1s;
            border-radius: 0 4px 4px 0; margin-right: 8px;
        }
        .settings-nav-item:hover { background: rgba(255,255,255,0.06); }
        .settings-nav-item.active { background: rgba(255,255,255,0.08); }
        .settings-nav-item .sni-icon { font-size: 18px; width: 24px; text-align: center; }
        .settings-content {
            flex: 1; padding: 24px 32px;
            overflow-y: auto;
        }
        .settings-content h2 { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        .settings-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 16px 20px;
            margin-bottom: 8px;
        }
        .settings-row {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }
        .settings-row-left { display: flex; align-items: center; gap: 12px; }
        .settings-row-left .sr-icon { font-size: 20px; }
        .settings-row-left .sr-info .sr-title { font-size: 14px; }
        .settings-row-left .sr-info .sr-desc { font-size: 12px; color: var(--text-tertiary); }
        .toggle-switch {
            width: 40px; height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px; cursor: pointer;
            position: relative; transition: background 0.2s;
        }
        .toggle-switch.on { background: var(--accent); }
        .toggle-switch::after {
            content: ''; position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            background: white; border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch.on::after { transform: translateX(20px); }

        /* Notepad */
        .notepad-body { display: flex; flex-direction: column; height: 100%; }
        .notepad-menu {
            display: flex; gap: 0; padding: 0 4px;
            background: rgba(32,32,32,0.98);
            border-bottom: 1px solid var(--glass-border);
        }
        .notepad-menu-item {
            padding: 4px 12px; font-size: 12px;
            color: var(--text-secondary); cursor: pointer;
            transition: background 0.1s;
        }
        .notepad-menu-item:hover { background: rgba(255,255,255,0.06); }
        .notepad-textarea {
            flex: 1; background: rgba(30,30,30,0.98);
            border: none; color: var(--text-primary);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px; padding: 12px;
            resize: none; outline: none;
            line-height: 1.6;
        }
        .notepad-statusbar {
            display: flex; justify-content: space-between;
            padding: 4px 12px; font-size: 11px;
            color: var(--text-tertiary);
            background: rgba(32,32,32,0.98);
            border-top: 1px solid var(--glass-border);
        }

        /* Calculator */
        .calc-body { display: flex; flex-direction: column; height: 100%; background: #202020; }
        .calc-display {
            padding: 20px 16px 12px;
            text-align: right; flex-shrink: 0;
        }
        .calc-expression { font-size: 14px; color: var(--text-tertiary); min-height: 20px; }
        .calc-result { font-size: 42px; font-weight: 300; color: white; }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px; padding: 4px; flex: 1;
        }
        .calc-btn {
            display: flex; align-items: center;
            justify-content: center;
            font-size: 18px; color: white;
            border-radius: 4px; cursor: pointer;
            transition: all 0.1s;
            background: rgba(255,255,255,0.06);
        }
        .calc-btn:hover { background: rgba(255,255,255,0.1); }
        .calc-btn:active { background: rgba(255,255,255,0.04); transform: scale(0.97); }
        .calc-btn.operator { background: rgba(255,255,255,0.04); }
        .calc-btn.operator:hover { background: rgba(255,255,255,0.08); }
        .calc-btn.equals { background: var(--accent); }
        .calc-btn.equals:hover { background: #1a86d9; }
        .calc-btn.top-row { background: rgba(255,255,255,0.03); font-size: 15px; }

        /* Browser */
        .browser-body { display: flex; flex-direction: column; height: 100%; background: #1a1a2e; }
        .browser-toolbar {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px;
            background: rgba(32,32,32,0.98);
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .browser-nav-btn {
            width: 28px; height: 28px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-secondary);
            transition: background 0.1s; font-size: 14px;
        }
        .browser-nav-btn:hover { background: rgba(255,255,255,0.06); }
        .browser-url {
            flex: 1; height: 32px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; color: var(--text-secondary);
            padding: 0 16px; font-size: 13px;
            font-family: inherit; outline: none;
        }
        .browser-url:focus { border-color: var(--accent); }
        .browser-content {
            flex: 1; overflow: auto;
            background: #1a1a2e; padding: 40px;
            display: flex; flex-direction: column;
            align-items: center;
        }
        .browser-logo { font-size: 48px; margin-bottom: 20px; }
        .browser-search-box {
            width: 100%; max-width: 500px; height: 44px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px; color: white;
            padding: 0 20px; font-size: 15px;
            font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        .browser-search-box:focus { border-color: var(--accent-light); }
        .browser-shortcuts {
            display: flex; gap: 16px; margin-top: 30px;
            flex-wrap: wrap; justify-content: center;
        }
        .browser-shortcut {
            width: 80px; display: flex; flex-direction: column;
            align-items: center; gap: 8px; padding: 12px 8px;
            border-radius: 8px; cursor: pointer;
            transition: background 0.15s;
        }
        .browser-shortcut:hover { background: rgba(255,255,255,0.06); }
        .browser-shortcut .bs-icon {
            width: 40px; height: 40px; border-radius: 8px;
            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .browser-shortcut .bs-name { font-size: 11px; color: var(--text-secondary); text-align: center; }

        /* Terminal */
        .terminal-body {
            height: 100%; background: #0c0c0c;
            padding: 12px; font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 14px; color: #cccccc;
            overflow-y: auto;
        }
        .terminal-line { line-height: 1.5; }
        .terminal-line .prompt { color: #569cd6; }
        .terminal-line .path { color: #dcdcaa; }
        .terminal-input-line { display: flex; align-items: center; line-height: 1.5; }
        .terminal-input {
            flex: 1; background: none; border: none;
            color: #cccccc; font-family: inherit;
            font-size: inherit; outline: none;
        }

        /* Photos App */
        .photos-body {
            height: 100%; background: #1e1e1e;
            display: flex; flex-direction: column;
        }
        .photos-toolbar {
            padding: 8px 16px; display: flex;
            align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .photos-toolbar h3 { font-size: 16px; font-weight: 500; }
        .photos-grid {
            flex: 1; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 4px; padding: 8px; overflow-y: auto;
        }
        .photos-item {
            aspect-ratio: 1; border-radius: 4px;
            overflow: hidden; cursor: pointer;
            transition: transform 0.15s;
        }
        .photos-item:hover { transform: scale(1.02); }
        .photos-item img { width: 100%; height: 100%; object-fit: cover; }

        /* ===== SELECTION RECT ===== */
        #selection-rect {
            position: fixed;
            border: 1px solid rgba(0,120,212,0.8);
            background: rgba(0,120,212,0.15);
            display: none; pointer-events: none;
            z-index: 50; border-radius: 1px;
        }

        /* ===== SHUTDOWN SCREEN ===== */
        #shutdown-screen {
            position: fixed; inset: 0; z-index: 99999;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 1.5s ease;
        }
        #shutdown-screen.active { opacity: 1; pointer-events: all; }
        .shutdown-dots {
            position: relative;
            width: 50px;
            height: 50px;
        }
        .shutdown-dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #60cdff;
            border-radius: 50%;
            opacity: 0;
            transform-origin: 25px 25px;
            animation: winCircle 3s infinite;
        }
        .shutdown-dot:nth-child(1) { animation-delay: 0.15s; }
        .shutdown-dot:nth-child(2) { animation-delay: 0.3s; }
        .shutdown-dot:nth-child(3) { animation-delay: 0.45s; }
        .shutdown-dot:nth-child(4) { animation-delay: 0.6s; }
        .shutdown-dot:nth-child(5) { animation-delay: 0.75s; }

        @keyframes winCircle {
            0% { transform: rotate(225deg); opacity: 1; animation-timing-function: ease-out; }
            7% { transform: rotate(345deg); animation-timing-function: linear; }
            30% { transform: rotate(455deg); animation-timing-function: ease-in-out; }
            39% { transform: rotate(690deg); animation-timing-function: linear; }
            70% { transform: rotate(815deg); opacity: 1; animation-timing-function: ease-out; }
            75% { transform: rotate(945deg); animation-timing-function: ease-out; }
            76% { transform: rotate(945deg); opacity: 0; }
            100% { transform: rotate(945deg); opacity: 0; }
        }
        .shutdown-text { color: white; font-size: 14px; margin-top: 16px; }

        /* ===== POWER MENU ===== */
        #power-menu {
            position: fixed; z-index: 2000;
            background: rgba(44, 44, 44, 0.96);
            backdrop-filter: blur(60px);
            border: 1px solid var(--glass-border-light);
            border-radius: 8px; padding: 4px;
            min-width: 180px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            opacity: 0; pointer-events: none;
            transform: scale(0.95) translateY(10px);
            transition: all 0.15s ease;
        }
        #power-menu.open { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); }
        .power-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px; border-radius: 4px;
            cursor: pointer; font-size: 13px;
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .power-item:hover { background: rgba(255,255,255,0.06); }
        .power-item .pi-icon { font-size: 16px; width: 20px; text-align: center; }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ===== TOOLTIP ===== */
        .tooltip {
            position: fixed; z-index: 3000;
            background: rgba(44,44,44,0.96);
            border: 1px solid var(--glass-border);
            border-radius: 4px; padding: 4px 8px;
            font-size: 12px; color: var(--text-primary);
            pointer-events: none; white-space: nowrap;
            opacity: 0; transition: opacity 0.15s;
        }
        .tooltip.visible { opacity: 1; }

        /* Animations */
        @keyframes slideUpFadeIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOutVideo {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        .fade-out-video {
            animation: fadeOutVideo 5s ease-in forwards;
        }
    </style>
</head>

<div id="taskbar">

            <svg viewBox="0 0 48.745 48.747"><g fill="#0078d4"><rect x="0" y="0" width="23.105" height="23.105"/><rect x="25.64" y="0" width="23.105" height="23.105"/><rect x="0" y="25.642" width="23.105" height="23.105"/><rect x="25.64" y="25.642" width="23.105" height="23.105"/></g></svg>

(function() {
    'use strict';

    // ===== INDEXEDDB VIRTUAL FILE SYSTEM (VFS) =====
    class W11VirtualFS {
        constructor() {
            this.dbName = 'W11VFS';
            this.dbVersion = 1;
            this.db = null;
        }

        init() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, this.dbVersion);

                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) {
                        db.createObjectStore('files', { keyPath: 'path' });
                    }
                };

                request.onsuccess = async (e) => {
                    this.db = e.target.result;
                    await this.prepopulateDefaults();
                    resolve();
                };

                request.onerror = (e) => reject(e.target.error);
            });
        }

        async prepopulateDefaults() {
            const count = await this.countFiles();
            if (count === 0) {
                // Populate high fidelity system workspace files
                const defaults = [
                    { path: 'readme.txt', content: 'Welcome to Windows 11 Web Edition!\n\nThis system is fully powered by a robust client-side IndexedDB Virtual File System (VFS) combined with a local Python 3 backend.\n\nAll your office files, notepad notes, drawings, and custom applications are safely saved inside your browser storage.\n\nEnjoy!', is_dir: false, size: 280 },
                    { path: 'Documents', content: '', is_dir: true, size: 0 },
                    { path: 'Documents/meeting.docx', content: '<h2>Project Kickstarter Minutes</h2><p>Our team is building an ultimate visual clone of Windows 11. Core applications such as Word, Excel, PowerPoint, OneNote, and Paint are completely operational.</p>', is_dir: false, size: 195 },
                    { path: 'Documents/sales.xlsx', content: 'A1,B1,C1\nMonths,Sales,Costs\nJanuary,12000,8000\nFebruary,15000,9500\n=SUM(B3,B4),=SUM(C3,C4),', is_dir: false, size: 85 },
                    { path: 'Pictures', content: '', is_dir: true, size: 0 },
                    { path: 'Pictures/drawing.png', content: '', is_dir: false, size: 0 },
                    { path: 'Downloads', content: '', is_dir: true, size: 0 }
                ];
                for (const file of defaults) {
                    await this.write(file.path, file.content, file.is_dir, file.size);
                }
            }
        }

        countFiles() {
            return new Promise((resolve) => {
                const tx = this.db.transaction('files', 'readonly');
                const store = tx.objectStore('files');
                const req = store.count();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => resolve(0);
            });
        }

        list(dirPath) {
            return new Promise((resolve) => {
                const tx = this.db.transaction('files', 'readonly');
                const store = tx.objectStore('files');
                const req = store.getAll();

                req.onsuccess = () => {
                    const all = req.result;
                    // Filter files that are direct children of dirPath
                    const result = [];
                    all.forEach(file => {
                        if (file.path === dirPath) return; // skip self

                        let parent = '';
                        const parts = file.path.split('/');
                        if (parts.length > 1) {
                            parts.pop();
                            parent = parts.join('/');
                        }

                        if (parent === dirPath) {
                            result.push({
                                name: file.path.split('/').pop(),
                                path: file.path,
                                is_dir: file.is_dir,
                                size: file.size || 0
                            });
                        }
                    });

                    // Sort dirs first, then alphabetical
                    result.sort((a, b) => {
                        if (a.is_dir && !b.is_dir) return -1;
                        if (!a.is_dir && b.is_dir) return 1;
                        return a.name.localeCompare(b.name);
                    });

                    resolve(result);
                };
                req.onerror = () => resolve([]);
            });
        }

        read(filePath) {
            return new Promise((resolve, reject) => {
                const tx = this.db.transaction('files', 'readonly');
                const store = tx.objectStore('files');
                const req = store.get(filePath);
                req.onsuccess = () => resolve(req.result ? req.result.content : null);
                req.onerror = () => reject(req.target.error);
            });
        }

        write(filePath, content, isDir = false, size = null) {
            return new Promise((resolve, reject) => {
                const fileRecord = {
                    path: filePath,
                    content: content,
                    is_dir: isDir,
                    size: size !== null ? size : (content ? content.length : 0),
                    updatedAt: Date.now()
                };
                const tx = this.db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                const req = store.put(fileRecord);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.target.error);
            });
        }

        delete(filePath) {
            return new Promise((resolve, reject) => {
                const tx = this.db.transaction('files', 'readwrite');
                const store = tx.objectStore('files');
                const req = store.delete(filePath);
                req.onsuccess = () => resolve(true);
                req.onerror = () => reject(req.target.error);
            });
        }

        rename(oldPath, newPath) {
            return new Promise(async (resolve, reject) => {
                try {
                    const content = await this.read(oldPath);
                    const fileRecord = {
                        path: newPath,
                        content: content,
                        is_dir: false,
                        size: content ? content.length : 0,
                        updatedAt: Date.now()
                    };
                    await this.delete(oldPath);
                    const tx = this.db.transaction('files', 'readwrite');
                    const store = tx.objectStore('files');
                    const req = store.put(fileRecord);
                    req.onsuccess = () => resolve(true);
                    req.onerror = () => reject(req.target.error);
                } catch (err) {
                    reject(err);
                }
            });
        }
    }

    // ===== TASKBAR =====
    function initTaskbar() {
        const pinned = document.getElementById('taskbar-pinned');
        pinned.style.display = 'flex';
        pinned.style.alignItems = 'center';
        pinned.style.gap = '2px';

        APPS.filter(a => a.taskbarPinned).forEach(app => {
            const btn = document.createElement('div');
            btn.className = 'taskbar-btn';
            btn.id = `tb-app-${app.id}`;
            btn.dataset.tooltip = app.name;
            btn.innerHTML = `<div class="tb-icon" style="display:flex;align-items:center;justify-content:center;">${getAppIconHTML(app, '24px')}</div>`;
            btn.addEventListener('click', () => {
                const appWindows = windows.filter(w => w.appId === app.id);
                if (appWindows.length === 0) {
                    openApp(app);
                } else {
                    const win = appWindows[0];
                    if (win.minimized) {
                        restoreWindow(win.id);
                    } else if (win.id === focusedWindowId) {
                        minimizeWindow(win.id);
                    } else {
                        focusWindow(win.id);
                    }
                }
            });
            pinned.appendChild(btn);
        });

        document.getElementById('tb-start').addEventListener('click', toggleStartMenu);
        document.getElementById('tb-search').addEventListener('click', toggleSearchPanel);
        document.getElementById('tb-widgets').addEventListener('click', toggleWidgetPanel);
        document.getElementById('clock-section').addEventListener('click', toggleNotifCenter);
        document.getElementById('tray-icons').addEventListener('click', toggleNotifCenter);

    function updateTaskbar() {
        APPS.forEach(app => {
            const btn = document.getElementById(`tb-app-${app.id}`);
            if (!btn) return;
            const appWindows = windows.filter(w => w.appId === app.id && !w.closing);
            const isRunning = appWindows.length > 0;
            const isActive = appWindows.some(w => w.id === focusedWindowId && !w.minimized);
            btn.classList.toggle('running', isRunning);
            btn.classList.toggle('active', isActive);
        });
    }

    // ===== WINDOW MANAGEMENT =====
    function openApp(app) {
        const id = ++windowIdCounter;
        const w = 700, h = 500;
        const x = 100 + (id % 8) * 30;
        const y = 50 + (id % 8) * 30;

        const winData = {
            id, appId: app.id, app,
            x, y, w, h,
            minimized: false, maximized: false, closing: false,
            prevX: x, prevY: y, prevW: w, prevH: h
        };
        windows.push(winData);

        const winEl = document.createElement('div');
        winEl.className = 'app-window opening focused';
        winEl.id = `window-${id}`;
        winEl.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++highestZIndex};`;

        winEl.innerHTML = `
            <div class="win-titlebar" data-win-id="${id}">
                <div class="win-titlebar-left">
                    <span class="win-icon" style="display:flex;align-items:center;">${getAppIconHTML(app, '16px')}</span>
                    <span class="win-title">${app.name}</span>
                </div>
                <div class="win-controls">
                    <div class="win-ctrl-btn minimize" data-win-id="${id}">
                        <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                    </div>
                    <div class="win-ctrl-btn maximize" data-win-id="${id}">
                        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                    </div>
                    <div class="win-ctrl-btn close" data-win-id="${id}">
                        <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                    </div>
                </div>
            </div>
            <div class="win-body">${getAppContent(app)}</div>
            <div class="resize-handle top" data-win-id="${id}" data-dir="n"></div>
            <div class="resize-handle bottom" data-win-id="${id}" data-dir="s"></div>
            <div class="resize-handle left" data-win-id="${id}" data-dir="w"></div>
            <div class="resize-handle right" data-win-id="${id}" data-dir="e"></div>
            <div class="resize-handle top-left" data-win-id="${id}" data-dir="nw"></div>
            <div class="resize-handle top-right" data-win-id="${id}" data-dir="ne"></div>
            <div class="resize-handle bottom-left" data-win-id="${id}" data-dir="sw"></div>
            <div class="resize-handle bottom-right" data-win-id="${id}" data-dir="se"></div>
        `;

        document.getElementById('desktop').appendChild(winEl);

        // Event listeners
        winEl.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.win-ctrl-btn')) focusWindow(id);
        });

        // Title bar double click to maximize
        winEl.querySelector('.win-titlebar').addEventListener('dblclick', () => toggleMaximize(id));

        // Controls
        winEl.querySelector('.minimize').addEventListener('click', () => minimizeWindow(id));
        winEl.querySelector('.maximize').addEventListener('click', () => toggleMaximize(id));
        winEl.querySelector('.close').addEventListener('click', () => closeWindow(id));

        // Dragging
        initWindowDrag(winEl.querySelector('.win-titlebar'), id);

        // Resizing
        winEl.querySelectorAll('.resize-handle').forEach(handle => {
            initWindowResize(handle, id);
        });

        // Init app-specific functionality
        initAppFunctionality(id, app);

        focusWindow(id);

        setTimeout(() => { winEl.classList.remove('opening'); }, 300);

        updateTaskbar();
    }

    function focusWindow(id) {
        focusedWindowId = id;
        document.querySelectorAll('.app-window').forEach(el => el.classList.remove('focused'));
        const el = document.getElementById(`window-${id}`);
        if (el) {
            el.classList.add('focused');
            el.style.zIndex = ++highestZIndex;
        }
        updateTaskbar();
    }

    function minimizeWindow(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        win.minimized = true;
        const el = document.getElementById(`window-${id}`);
        if (el) el.classList.add('minimized');
        if (focusedWindowId === id) {
            focusedWindowId = null;
            const visibleWindows = windows.filter(w => !w.minimized && !w.closing);
            if (visibleWindows.length > 0) focusWindow(visibleWindows[visibleWindows.length - 1].id);
        }
        updateTaskbar();
    }

    function restoreWindow(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        win.minimized = false;
        const el = document.getElementById(`window-${id}`);
        if (el) {
            el.classList.remove('minimized');
            el.style.transition = 'all 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
            setTimeout(() => { el.style.transition = ''; }, 250);
        }
        focusWindow(id);
    }

    function toggleMaximize(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        const el = document.getElementById(`window-${id}`);
        if (!el) return;

        if (win.maximized) {
            win.maximized = false;
            el.classList.remove('maximized');
            el.style.left = win.prevX + 'px';
            el.style.top = win.prevY + 'px';
            el.style.width = win.prevW + 'px';
            el.style.height = win.prevH + 'px';
        } else {
            win.prevX = parseInt(el.style.left);
            win.prevY = parseInt(el.style.top);
            win.prevW = parseInt(el.style.width);
            win.prevH = parseInt(el.style.height);
            win.maximized = true;
            el.classList.add('maximized');
        }
    }

    function closeWindow(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        win.closing = true;
        const el = document.getElementById(`window-${id}`);
        if (el) {
            el.classList.add('closing');
            setTimeout(() => {
                el.remove();
                windows = windows.filter(w => w.id !== id);
                if (focusedWindowId === id) {
                    focusedWindowId = null;
                    const visibleWindows = windows.filter(w => !w.minimized && !w.closing);
                    if (visibleWindows.length > 0) focusWindow(visibleWindows[visibleWindows.length - 1].id);
                }
                updateTaskbar();
            }, 200);
        }
        updateTaskbar();
    }

    // ===== WINDOW DRAG =====
    function initWindowDrag(titlebar, winId) {
        let isDragging = false;
        let startX, startY, origX, origY;

        titlebar.addEventListener('mousedown', (e) => {
            if (e.target.closest('.win-controls')) return;
            const win = windows.find(w => w.id === winId);
            if (!win) return;
            if (win.maximized) return;
            isDragging = true;
            const el = document.getElementById(`window-${winId}`);
            startX = e.clientX;
            startY = e.clientY;
            origX = parseInt(el.style.left);
            origY = parseInt(el.style.top);
            e.preventDefault();

            const onMove = (e2) => {
                if (!isDragging) return;
                const dx = e2.clientX - startX;
                const dy = e2.clientY - startY;
                el.style.left = (origX + dx) + 'px';
                el.style.top = Math.max(0, origY + dy) + 'px';
            };
            const onUp = () => {
                isDragging = false;
                // Snap to top = maximize
                const el = document.getElementById(`window-${winId}`);
                if (el && parseInt(el.style.top) <= 0) {
                    toggleMaximize(winId);
                }
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
    }

    // ===== WINDOW RESIZE =====
    function initWindowResize(handle, winId) {
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const win = windows.find(w => w.id === winId);
            if (!win || win.maximized) return;

            const el = document.getElementById(`window-${winId}`);
            const dir = handle.dataset.dir;
            const startX = e.clientX, startY = e.clientY;
            const origX = parseInt(el.style.left), origY = parseInt(el.style.top);
            const origW = parseInt(el.style.width), origH = parseInt(el.style.height);

            const onMove = (e2) => {
                const dx = e2.clientX - startX;
                const dy = e2.clientY - startY;
                let newX = origX, newY = origY, newW = origW, newH = origH;

                if (dir.includes('e')) newW = Math.max(320, origW + dx);
                if (dir.includes('w')) { newW = Math.max(320, origW - dx); newX = origX + (origW - newW); }
                if (dir.includes('s')) newH = Math.max(200, origH + dy);
                if (dir.includes('n')) { newH = Math.max(200, origH - dy); newY = Math.max(0, origY + (origH - newH)); }

                el.style.left = newX + 'px';
                el.style.top = newY + 'px';
                el.style.width = newW + 'px';
                el.style.height = newH + 'px';
            };
            const onUp = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });
    }

    function getExcelContent() {
        let colHeaders = '';
        for (let i = 0; i < 10; i++) {
            colHeaders += `<div style="flex:1; text-align:center; background:#f3f2f1; border-right:1px solid #d2d0ce; font-weight:600; font-size:11px; padding:2px 0;">${String.fromCharCode(65 + i)}</div>`;
        }

        let gridRows = '';
        for (let r = 1; r <= 15; r++) {
            let rowCells = `<div style="width:30px; text-align:center; background:#f3f2f1; border-bottom:1px solid #d2d0ce; border-right:1px solid #d2d0ce; font-weight:600; font-size:11px; padding:4px 0;">${r}</div>`;
            for (let c = 0; c < 10; c++) {
                let cellId = `${String.fromCharCode(65 + c)}${r}`;
                rowCells += `<input class="excel-cell" id="cell-${cellId}" data-cell-id="${cellId}" style="flex:1; border:none; border-right:1px solid #d2d0ce; border-bottom:1px solid #d2d0ce; font-size:12px; padding:4px; outline:none; background:white; color:#333;" value="">`;
            }
            gridRows += `<div style="display:flex; height:26px;">${rowCells}</div>`;
        }

        return `
            <div class="excel-body" style="height:100%; background:white; display:flex; flex-direction:column; color:#333; font-family:'Segoe UI', sans-serif;">
                <div class="excel-ribbon" style="background:#107c41; padding:6px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0;">
                    <span style="font-size:13px; font-weight:600; color:white; margin-right:12px;">Excel</span>

                    <input class="excel-formula-bar" placeholder="e.g. =SUM(A1,A2) or =A1+B1" style="flex:1; height:24px; border:none; padding:0 8px; font-size:11px; border-radius:4px; background:rgba(255,255,255,0.2); color:white; outline:none;">
                    <button class="excel-save-btn" style="background:#005a9e; border:none; color:white; padding:4px 12px; border-radius:4px; font-size:11px; font-weight:500; cursor:pointer;">Save VFS</button>
                    <input class="excel-filename" value="sheet.xlsx" style="background:rgba(0,0,0,0.2); border:none; color:white; font-size:12px; padding:4px 8px; border-radius:4px; width:100px; outline:none;">
                </div>
                <div class="excel-grid-container" style="flex:1; overflow:auto; display:flex; flex-direction:column;">
                    <div style="display:flex; height:20px; flex-shrink:0;">
                        <div style="width:30px; background:#f3f2f1; border-right:1px solid #d2d0ce; border-bottom:1px solid #d2d0ce;"></div>
                        ${colHeaders}
                    </div>
                    <div class="excel-grid-rows" style="flex:1;">

                </div>
            </div>
        `;
    }
